<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRABZ Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07110d;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #0d1b15;
            padding: 35px 25px;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(0, 255, 120, 0.15);
        }

        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #294436;
            border-radius: 10px;
            background: #07110d;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #00ff88;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #00ff88;
            color: #06100b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .register a {
            color: #00ff88;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>DRABZ</h1>

        <p class="subtitle">Trading Education Platform</p>

        <form method="POST" action="/login">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p class="register">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</body>
</html>
