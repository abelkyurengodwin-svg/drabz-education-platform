<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRABZ | Register</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #07110b;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            width: 90%;
            max-width: 400px;
            background: #0d1b12;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(25, 232, 117, 0.2);
        }

        h1 {
            text-align: center;
            color: #19e875;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #263d2d;
            border-radius: 8px;
            background: #07110b;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #19e875;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #19e875;
            color: #07110b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #19e875;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>DRABZ</h1>

        <p>Create your trading education account</p>

        <form method="POST" action="/register">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>

</body>
</html>
